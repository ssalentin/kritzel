<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">How a drawing comes alive in Kritzel</title>
  <desc id="d">Five steps from left to right: a child draws on paper; a camera above the paper watches; Kritzel notices the drawing is finished and lights a glow in the book after about 1.5 seconds; Claude reads the drawing and writes a small 3D program for it; about 15 seconds after the pen lifts, the creature pops up out of the pop-up book and starts living there.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#f3e9d6"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4378"/>
      <stop offset="1" stop-color="#e9a987"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd88a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pencil" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="8" height="8" fill="#f3d36b"/>
      <path d="M0 2 H8 M0 6 H8" stroke="#d9a93a" stroke-width="1.5" opacity="0.7"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10202e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="28" fill="url(#bg)"/>

  <g font-family="'Patrick Hand', 'Comic Neue', 'Segoe Print', 'Chalkboard SE', cursive" fill="#10202e" text-anchor="middle">

    <!-- 1 · draw -->
    <g transform="translate(120 170)">
      <path d="M-78 -62 L72 -70 L80 62 L-72 70 Z" fill="#ffffff" stroke="#10202e" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-22 40 C -30 10, -30 -20, -18 -42 C -10 -56, 8 -54, 6 -38 C 2 -12, 0 14, 0 40 Z" fill="none" stroke="#10202e" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-14" cy="-26" r="3" fill="#10202e"/><circle cx="-2" cy="-27" r="3" fill="#10202e"/>
      <path d="M-15 -14 v5 h11 v-5" fill="none" stroke="#10202e" stroke-width="3"/>
      <g transform="translate(44 6) rotate(32)">
        <rect x="-8" y="-58" width="16" height="54" rx="3" fill="#f7b733" stroke="#10202e" stroke-width="4"/>
        <path d="M-8 -4 L0 14 L8 -4 Z" fill="#f6dcb4" stroke="#10202e" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <text y="118" font-size="26">1 · Draw</text>
      <text y="148" font-size="20" fill="#5a5560">on plain paper, or lay down</text>
      <text y="172" font-size="20" fill="#5a5560">a sticker or a picture</text>
    </g>

    <!-- 2 · the camera watches -->
    <g transform="translate(360 170)">
      <path d="M-56 70 h112" stroke="#10202e" stroke-width="6" stroke-linecap="round"/>
      <path d="M-40 70 L-20 -40 L30 -54" fill="none" stroke="#10202e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="-74" width="56" height="38" rx="9" fill="#3b3a6b" stroke="#10202e" stroke-width="5"/>
      <circle cx="46" cy="-36" r="10" fill="#9fb4f2" stroke="#10202e" stroke-width="4"/>
      <path d="M46 -24 L18 58 M46 -24 L84 58" stroke="#9fb4f2" stroke-width="4" stroke-dasharray="7 7" opacity="0.9"/>
      <path d="M8 62 h86" stroke="#10202e" stroke-width="4" stroke-linecap="round"/>
      <text y="118" font-size="26">2 · The camera watches</text>
      <text y="148" font-size="20" fill="#5a5560">8 times a second, and waits</text>
      <text y="172" font-size="20" fill="#5a5560">until your hand is gone</text>
    </g>

    <!-- 3 · noticed: the glow -->
    <g transform="translate(600 170)">
      <circle cx="0" cy="-4" r="66" fill="url(#glow)"/>
      <circle cx="0" cy="-4" r="16" fill="#fff1c4" stroke="#e8a94a" stroke-width="3"/>
      <g fill="#ffd38a"><circle cx="-24" cy="-40" r="4"/><circle cx="20" cy="-52" r="3"/><circle cx="30" cy="-24" r="3.5"/><circle cx="-34" cy="-14" r="3"/></g>
      <rect x="-112" y="38" width="224" height="36" rx="18" fill="#ffffff" stroke="#10202e" stroke-width="3"/>
      <text y="63" font-size="19">Was haben wir denn da?</text>
      <text y="118" font-size="26">3 · Noticed</text>
      <text y="148" font-size="20" fill="#5a5560">a warm light shows where</text>
      <text y="172" font-size="20" fill="#5a5560">it will stand · ≈ 1.5 s</text>
    </g>

    <!-- 4 · Claude reads and builds -->
    <g transform="translate(840 170)">
      <rect x="-66" y="-66" width="132" height="104" rx="14" fill="#ffffff" stroke="#10202e" stroke-width="5"/>
      <path d="M-66 -40 h132" stroke="#10202e" stroke-width="4"/>
      <g fill="#d97757"><circle cx="-48" cy="-53" r="5"/><circle cx="-32" cy="-53" r="5" opacity="0.7"/><circle cx="-16" cy="-53" r="5" opacity="0.45"/></g>
      <g stroke-width="5" stroke-linecap="round">
        <path d="M-46 -20 h48" stroke="#8a6a9c"/><path d="M-36 -2 h70" stroke="#6aa65a"/>
        <path d="M-36 16 h40" stroke="#d97757"/><path d="M-46 34 h60" stroke="#8a6a9c" opacity="0"/>
      </g>
      <path d="M44 -10 l12 0 M50 -16 l0 12" stroke="#10202e" stroke-width="3" stroke-linecap="round"/>
      <text y="118" font-size="26">4 · Claude builds it</text>
      <text y="148" font-size="20" fill="#5a5560">reads the drawing, writes a</text>
      <text y="172" font-size="20" fill="#5a5560">small 3D program, checked safe</text>
    </g>

    <!-- 5 · alive in the book -->
    <g transform="translate(1080 170)">
      <rect x="-92" y="-82" width="184" height="152" rx="16" fill="url(#dusk)"/>
      <path d="M-74 40 C -40 26, -14 32, 0 46 L0 64 C -14 54, -40 48, -74 58 Z" fill="#f6ecd8" stroke="#10202e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M74 40 C 40 26, 14 32, 0 46 L0 64 C 14 54, 40 48, 74 58 Z" fill="#f6ecd8" stroke="#10202e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-74 58 L0 70 L74 58" fill="none" stroke="#8a3b2e" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-10 46 C -16 20, -16 -10, -6 -30 C 2 -44, 18 -42, 16 -26 C 12 -4, 12 22, 12 46 Z" fill="url(#pencil)" stroke="#10202e" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-3" cy="-14" r="3" fill="#10202e"/><circle cx="8" cy="-15" r="3" fill="#10202e"/>
      <path d="M-4 -3 v5 h11 v-5" fill="none" stroke="#10202e" stroke-width="3"/>
      <g stroke="#10202e" stroke-width="2"><rect x="-46" y="-48" width="9" height="6" fill="#f08a8a" transform="rotate(-20 -42 -45)"/><rect x="36" y="-56" width="9" height="6" fill="#8fd1b8" transform="rotate(25 40 -53)"/><rect x="40" y="-14" width="8" height="5" fill="#ffe27a"/></g>
      <rect x="-80" y="-74" width="88" height="26" rx="13" fill="#ffffff" stroke="#10202e" stroke-width="2.5"/>
      <text x="-36" y="-55" font-size="16">Hallo!</text>
      <text y="118" font-size="26">5 · It comes alive</text>
      <text y="148" font-size="20" fill="#5a5560">pops up out of the book,</text>
      <text y="172" font-size="20" fill="#5a5560">walks and talks · ≈ 15 s</text>
    </g>

    <!-- arrows between the steps -->
    <g stroke="#10202e" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M212 150 C 232 132, 252 132, 272 150"/>
      <path d="M452 150 C 472 132, 492 132, 512 150"/>
      <path d="M692 150 C 712 132, 732 132, 752 150"/>
      <path d="M932 150 C 952 132, 972 132, 992 150"/>
    </g>
  </g>
</svg>
