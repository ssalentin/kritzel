<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Kritzel</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a6b"/>
      <stop offset="0.55" stop-color="#8a6a9c"/>
      <stop offset="1" stop-color="#f2b38a"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ecd8"/>
      <stop offset="1" stop-color="#e2d3b6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f6ecd8"/>
      <stop offset="1" stop-color="#e2d3b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd88a" stop-opacity="0"/>
    </radialGradient>
    <!-- coloured-pencil strokes, as on every drawn thing in the book -->
    <pattern id="pencil" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="9" height="9" fill="#f3d36b"/>
      <path d="M0 2 H9 M0 6.5 H9" stroke="#d9a93a" stroke-width="1.6" opacity="0.7"/>
    </pattern>
  </defs>

  <rect x="44" y="44" width="424" height="424" rx="72" fill="url(#sky)"/>

  <!-- stars and the drawn moon -->
  <g fill="#fff6d8">
    <circle cx="112" cy="112" r="5"/><circle cx="170" cy="80" r="3.5"/><circle cx="300" cy="92" r="3"/>
    <circle cx="418" cy="108" r="3"/><circle cx="140" cy="168" r="2.5"/>
  </g>
  <path d="M380 72 a52 52 0 1 0 38 88 a42 42 0 1 1 -38 -88z" fill="#ffe27a" stroke="#10202e" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="341" cy="112" r="5" fill="#10202e"/>
  <path d="M336 136 q8 7 17 1" fill="none" stroke="#10202e" stroke-width="5" stroke-linecap="round"/>

  <!-- the open pop-up book -->
  <path d="M74 334 L256 360 L256 444 L74 414 Z" fill="#8a3b2e" stroke="#10202e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M438 334 L256 360 L256 444 L438 414 Z" fill="#8a3b2e" stroke="#10202e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M86 322 C 150 300, 214 318, 256 346 L256 424 C 214 398, 150 384, 86 402 Z" fill="url(#pageL)" stroke="#10202e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M426 322 C 362 300, 298 318, 256 346 L256 424 C 298 398, 362 384, 426 402 Z" fill="url(#pageR)" stroke="#10202e" stroke-width="7" stroke-linejoin="round"/>
  <!-- a few lines of "text" on the pages -->
  <path d="M110 352 q40 -10 80 0 M110 372 q40 -10 70 0 M326 356 q40 -10 80 -2 M336 376 q36 -8 64 0" fill="none" stroke="#10202e" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>

  <!-- the glow where a new drawing pops up -->
  <circle cx="256" cy="300" r="92" fill="url(#glow)"/>

  <!-- Bana pops up out of the gutter, coloured in with pencil -->
  <path d="M236 340 C 226 300, 226 252, 242 214 C 254 190, 280 192, 278 220 C 274 256, 270 300, 270 340 Z"
        fill="url(#pencil)" stroke="#10202e" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="246" cy="238" r="5" fill="#10202e"/><circle cx="262" cy="236" r="5" fill="#10202e"/>
  <path d="M244 254 v8 h17 v-8" fill="none" stroke="#10202e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M235 300 q17 7 35 0" fill="none" stroke="#6b4226" stroke-width="8" stroke-linecap="round"/>
  <!-- the fold the pop-up hinges on -->
  <path d="M226 344 q30 8 60 0" fill="none" stroke="#10202e" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- confetti from the arrival -->
  <g stroke="#10202e" stroke-width="2.5">
    <rect x="190" y="200" width="11" height="7" rx="1.5" fill="#f08a8a" transform="rotate(-20 195 203)"/>
    <rect x="312" y="190" width="11" height="7" rx="1.5" fill="#8fd1b8" transform="rotate(25 317 193)"/>
    <rect x="300" y="246" width="9" height="6" rx="1.5" fill="#ffe27a" transform="rotate(-35 304 249)"/>
    <rect x="196" y="262" width="9" height="6" rx="1.5" fill="#9fb4f2" transform="rotate(30 200 265)"/>
  </g>

  <!-- the pencil that drew it all -->
  <g transform="translate(392 230) rotate(38)">
    <rect x="-13" y="-96" width="26" height="92" rx="4" fill="#f7b733" stroke="#10202e" stroke-width="6"/>
    <rect x="-13" y="-110" width="26" height="18" rx="4" fill="#f08a8a" stroke="#10202e" stroke-width="6"/>
    <path d="M-13 -4 L0 26 L13 -4 Z" fill="#f6dcb4" stroke="#10202e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-4 17 L0 26 L4 17 Z" fill="#10202e"/>
  </g>
</svg>
