<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper World</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #bfe3dd; --fg: #10202e; --panel: rgba(255,255,255,.78); }
  /* --sky0..2 and --ink follow the time of day (mood.js) */
  :root { --sky0: #e8ad8a; --sky1: #6e5d8c; --sky2: #2c2848; --ink: #fff4ea; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 42%, var(--sky0) 0%, var(--sky1) 55%, var(--sky2) 100%); color: var(--fg); overflow: hidden;
    font: 14px/1.45 system-ui, sans-serif; }
  #hud { position: fixed; left: 16px; top: 48px; max-width: min(560px, calc(100vw - 32px));
    background: var(--panel); border-radius: 10px; padding: 8px 12px; pointer-events: none; }
  #hud:has(#err:empty) { display: none; }
  #err { color: #b3261e; white-space: pre-wrap; }
  /* pipeline status pill (status.js): folds to a dot when nothing is happening */
  #status { position: fixed; left: 16px; top: 12px; display: flex; align-items: center; gap: 6px; box-sizing: border-box;
    max-width: calc(100vw - 310px); background: var(--panel); border-radius: 999px; padding: 4px 10px 4px 8px;
    font-size: 13px; line-height: 1.3; pointer-events: none; transition: padding .4s; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #3a9d5d; }
  #status[data-tone=busy] .dot { background: #e0a020; animation: pulse .8s ease-in-out infinite alternate; }
  #status[data-tone=warn] .dot { background: #e0a020; }
  #status[data-tone=bad] .dot { background: #d0443a; }
  #status .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #status img { height: 26px; max-width: 40px; object-fit: contain; flex: none; }
  #status .gen { color: #b3261e; white-space: nowrap; }
  #status.calm { padding: 5px; }
  #status.calm .text, #status.calm img { display: none; }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
  @media (max-width: 560px) { #status { top: auto; bottom: 52px; max-width: calc(100vw - 32px); } }
  /* the name of a drawing that just came alive, big for a moment (status.js) */
  #arrive { position: fixed; left: 50%; top: 16%; transform: translate(-50%, 0) scale(.6); opacity: 0; pointer-events: none;
    font: 800 clamp(30px, 7vw, 64px)/1.1 system-ui, sans-serif; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 24px rgba(255,200,120,.75); }
  #arrive.on { animation: arrive 2.4s ease-out; }
  @keyframes arrive { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
    20% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -12px) scale(1); } }
  #hint { position: fixed; left: 16px; bottom: 12px; opacity: .6; color: var(--ink); font-size: 13px; pointer-events: none; }
  #card { position: fixed; right: 16px; bottom: 12px; max-width: min(280px, calc(100vw - 32px)); display: none;
    background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  #card b { display: block; font-size: 15px; }
  #card .rel { margin-top: 4px; font-size: 13px; }
  #snd { position: fixed; right: 16px; top: 12px; font: 13px system-ui, sans-serif; color: var(--fg); background: var(--panel);
    border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; opacity: .8; }
  #langBtn b { text-decoration: underline; text-underline-offset: 3px; }
  #langBtn span { opacity: .55; }
  #langBtn { position: fixed; right: 232px; top: 12px; font: 600 13px system-ui, sans-serif; color: var(--fg); background: var(--panel);
    border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; opacity: .8; }
  #camBtn { position: fixed; right: 124px; top: 12px; font: 13px system-ui, sans-serif; color: var(--fg); background: var(--panel);
    border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; opacity: .8; }
  #cam { position: fixed; right: 16px; top: 48px; width: min(300px, calc(100vw - 32px)); box-sizing: border-box;
    background: var(--panel); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  #cam[hidden] { display: none; }
  #cam .row { display: flex; gap: 6px; }
  #cam select { flex: 1; min-width: 0; font: inherit; }
  #cam video, #cam img { width: 100%; border-radius: 6px; background: #0002; }
  #cam .note { font-size: 12px; opacity: .75; }
  #cam .note:empty { display: none; }
  #veil { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.88), rgba(191,227,221,.92));
    opacity: 0; transition: opacity .6s ease; font: 600 22px system-ui, sans-serif; color: #2c4a44; }
  #veil.on { opacity: 1; }
  #veil .pen { display: inline-block; animation: draw 0.9s ease-in-out infinite alternate; }
  #veil .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes draw { from { transform: translate(-14px, 4px) rotate(-12deg); } to { transform: translate(14px, -4px) rotate(8deg); } }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "rot-js": "https://cdn.jsdelivr.net/npm/rot-js@2.2.1/+esm"
} }
</script>
</head>
<body>
<div id="hud"><div id="err"></div></div>
<div id="arrive" aria-live="polite"></div>
<div id="status" data-tone="ok"><span class="dot"></span><img alt="" hidden><span class="text"></span><span class="gen" hidden>⚠ Generator aus</span></div>
<div id="veil"><div><span class="pen">✏️</span> Neue Welt wird gemalt<span class="dots"></span></div></div>
<div id="hint">Tippe eine Figur an, um ihr mit der Kamera zu folgen · Esc beendet <span id="ver"></span></div>
<div id="card"></div>
<button id="snd" type="button" aria-pressed="false">🔇 Ton an</button>
<button id="camBtn" type="button">📷 Kamera</button>
<button id="langBtn" type="button"></button>
<div id="cam" hidden>
  <div class="row"><select aria-label="Kamera"></select><button class="refresh" type="button" title="Neu suchen">↻</button></div>
  <video autoplay muted playsinline hidden></video>
  <img alt="Kamerabild" hidden>
  <div class="note"></div>
</div>
<script type="module">
// Engine only: sky, ground, lights, camera, hot reload.
// Everything that lives in the world comes from world.js, which is rewritten
// whenever a new drawing appears on the paper.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createMood } from './mood.js';
import { createStatus } from './status.js';
import { createStyle } from './style.js';
import { t, lang, setLang, onLang } from './i18n.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
// Littlest-Tokyo look: very soft (blurred) shadows, no tone-mapping curve → clean pastel colours
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Style modelled on the three.js "Littlest Tokyo" keyframes example: a floating low-poly
// diorama lit by a room environment. The backdrop is a soft CSS gradient behind the
// transparent canvas; its colours follow the time of day (mood.js).
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
camera.position.set(13, 5.8, 16.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 6;
controls.maxDistance = 40;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
// ?cam=x,y,z,tx,ty,tz pins the view (handy for screenshots)
const camQ = new URLSearchParams(location.search).get('cam')?.split(',').map(Number);
if (camQ?.length === 6) { camera.position.set(...camQ.slice(0, 3)); controls.target.set(...camQ.slice(3)); controls.autoRotate = false; }

// light comes mostly from the room environment (as in the example); the sun only adds soft shadows
const hemi = new THREE.HemisphereLight(0xfff4e6, 0x9cc7b8, 0.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 0.9);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11 });
sun.shadow.bias = -0.0005;
sun.shadow.radius = 8;
sun.shadow.blurSamples = 16;
sun.shadow.normalBias = 0.02;
scene.add(sun);
// soft mint bounce light from below so the rocky underside of the island reads
const bounce = new THREE.DirectionalLight(0xf2ead8, 0.25);
bounce.position.set(-3, -10, 5);
scene.add(bounce);
// Kritzel's look: ink outlines, pencil hatching and paper grain over the rendered scene
const style = createStyle({ THREE, renderer, scene, camera });
window.__style = style;                  // try things out: __style.enabled, __style.uniforms.inkWidth.value …

// drawn suns, moons and lamps set the time of day and light their surroundings
const lighting = createMood({ THREE, scene, key: sun, hemi, bounce });

// the floating island itself is built by island.js (part of the world, hot reloaded)

const world = new THREE.Group();
scene.add(world);

// speech bubble / thought bubble / name label sprite, attached to an object.
// Thoughts: text starting with 💭, *actions* and Zzz… are drawn as a cloud with little circles,
// in italics and without babble. Every speaker gets a colour (border + name tag) so overlapping
// bubbles stay apart; layoutBubbles() stacks overlapping ones on screen every frame.
const bubbles = new Set();
const HUES = [210, 140, 330, 30, 270, 180, 0, 90, 300, 55], hues = new Map();
const hueOf = s => {                                  // a speaker's colour, the same after every reload
  if (!hues.has(s)) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; hues.set(s, HUES[h % HUES.length]); }
  return hues.get(s);
};
function bubble(parent, y, { name = false } = {}) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ depthTest: false, transparent: true }));
  sprite.renderOrder = 10;
  sprite.layers.set(1);              // drawn after the paper pass, so no ink crosses a bubble (style.js)
  sprite.visible = false;            // hidden until there is something to say
  sprite.position.y = y;
  sprite.userData = { baseY: y, shift: 0 };
  parent.add(sprite);
  if (!name) bubbles.add(sprite);
  let last = null;
  return {
    sprite,
    say(text) {
      if (text === last) return;
      last = text;
      sprite.visible = !!text;
      if (!text) return;
      const thought = !name && (/^💭/u.test(text) || /^\*.+\*$/.test(text) || /^Zzz/.test(text));
      if (thought) text = text.replace(/^💭\s*/u, '').replace(/^\*(.+)\*$/, '$1');
      if (!name && !thought) sound?.speak(parent, text);   // a speech bubble: soft babble
      const cut = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;      // model-written names/lines can be long
      text = cut(text, 90);
      const who = cut(name ? '' : (actorsNow().find(a => a.rig?.g === parent)?.name || ''), 20);
      const hue = hueOf(who || parent.uuid);
      const font = name ? '600 44px system-ui' : thought ? 'italic 500 38px system-ui' : '600 40px system-ui';
      ctx.font = font;
      const tw = Math.ceil(ctx.measureText(text).width);
      const tag = who ? 30 : 0;                       // room for the name tag above the bubble
      ctx.font = '700 24px system-ui';
      const nameW = who ? Math.ceil(ctx.measureText(who).width) + 22 : 0;
      ctx.font = font;
      const w = Math.max(tw + 56, nameW + 40), h = 76, tail = name ? 0 : thought ? 34 : 18;
      cv.width = w + 8; cv.height = tag + h + tail + 4;
      const top = tag;
      if (name) {
        ctx.fillStyle = 'rgba(20,30,45,.82)';
        ctx.beginPath(); ctx.roundRect(2, 2, w - 4, h - 4, 30); ctx.fill();
      } else if (thought) {
        // a cloud: overlapping circles along the edge, then two small circles trailing down
        ctx.fillStyle = 'rgba(236,244,255,.96)'; ctx.strokeStyle = `hsl(${hue} 55% 55%)`; ctx.lineWidth = 3;
        const cloud = () => {
          ctx.beginPath();
          ctx.roundRect(14, top + 10, w - 20, h - 22, 26);
          for (let x = 34; x < w - 20; x += 34) { ctx.moveTo(x + 18, top + 12); ctx.arc(x, top + 14, 18, 0, Math.PI * 2); ctx.moveTo(x + 18, top + h - 14); ctx.arc(x, top + h - 14, 18, 0, Math.PI * 2); }
          ctx.moveTo(34, top + h / 2); ctx.arc(20, top + h / 2, 16, 0, Math.PI * 2);
          ctx.moveTo(w - 4, top + h / 2); ctx.arc(w - 18, top + h / 2, 16, 0, Math.PI * 2);
        };
        cloud(); ctx.stroke(); cloud(); ctx.fill();
        for (const [cx, cy, r] of [[w / 2 - 6, top + h + 8, 9], [w / 2 - 16, top + h + 24, 6]]) {
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = `hsl(${hue} 60% 50%)`; ctx.lineWidth = 5;
        const shape = () => {
          ctx.beginPath(); ctx.roundRect(4, top + 4, w - 8, h - 8, 28);
          ctx.moveTo(w / 2 - 14, top + h - 4); ctx.lineTo(w / 2, top + h + 14); ctx.lineTo(w / 2 + 14, top + h - 4);
        };
        shape(); ctx.stroke(); shape(); ctx.fill();
      }
      if (who) {                                    // name tag in the speaker's colour
        ctx.font = '700 24px system-ui';
        const nw = Math.ceil(ctx.measureText(who).width) + 22;
        ctx.fillStyle = `hsl(${hue} 60% 42%)`;
        ctx.beginPath(); ctx.roundRect(18, 0, nw, 30, 12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(who, 29, 16);
      }
      ctx.font = font;
      ctx.fillStyle = name ? '#fff' : thought ? '#3a4a66' : '#152030';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, w / 2, top + h / 2 + 1);
      sprite.material.map?.dispose();
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      sprite.material.map = tex;
      sprite.material.needsUpdate = true;
      const s = 0.0085;
      sprite.scale.set(cv.width * s, cv.height * s, 1);
      sprite.center.set(0.5, 0);
    },
  };
}

// keep visible bubbles from covering each other: nearer bubbles keep their place and are drawn
// on top; farther ones move up or sideways on screen (via the sprite's centre, so in pixels)
// until they're clear and still on screen. A bubble keeps its slot until it's really covered.
const _bp = new THREE.Vector3(), _bs = new THREE.Vector3();
function layoutBubbles(dt) {
  const list = [];
  for (const sp of bubbles) {
    if (!sp.parent) { bubbles.delete(sp); continue; }
    if (!sp.visible || !sp.parent.visible) continue;
    sp.getWorldPosition(_bp);
    const dist = _bp.distanceTo(camera.position);
    const perPx = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / innerHeight;
    sp.getWorldScale(_bs);
    _bp.project(camera);
    if (_bp.z > 1) continue;
    list.push({ sp, dist, x: (_bp.x + 1) / 2 * innerWidth, yb: (1 - _bp.y) / 2 * innerHeight, w: _bs.x / perPx, h: _bs.y / perPx });
  }
  list.sort((a, b) => a.dist - b.dist);
  const placed = [];
  const now = performance.now();
  const overlap = r => { let ov = 0; for (const o of placed) ov += Math.max(0, Math.min(r.r, o.r) - Math.max(r.l, o.l)) * Math.max(0, Math.min(r.b, o.b) - Math.max(r.t, o.t)); return ov; };
  const rect = (b, dx, dy) => ({ l: b.x + dx - b.w / 2, r: b.x + dx + b.w / 2, t: b.yb - dy - b.h, b: b.yb - dy });
  const onScreen = r => r.t >= 4 && r.l >= 4 && r.r <= innerWidth - 4;
  list.forEach((b, i) => {
    const u = b.sp.userData;
    u.slot ??= { dx: 0, dy: 0 };
    // sticky: keep the current slot while it's on screen and (almost) clear; only look for a new
    // one when it's really covered, and not more often than every 400 ms per bubble
    // back home (right above the speaker) as soon as that spot is clear again
    if ((u.slot.dx || u.slot.dy) && now >= (u.movedAt || 0) + 400) {
      const home = rect(b, 0, 0);
      if (onScreen(home) && overlap(home) === 0) { u.slot = { dx: 0, dy: 0 }; u.movedAt = now; }
    }
    const cur = rect(b, u.slot.dx, u.slot.dy);
    const tolerance = b.w * b.h * 0.04;
    if (!(onScreen(cur) && overlap(cur) <= tolerance) && !(now < (u.movedAt || 0) + 400)) {
      let best = null, bestOv = Infinity;
      search: for (let k = 0; k <= 10; k++) {
        for (const sx of [0, -1, 1, -2, 2, -3, 3]) {
          const dx = sx * b.w * 0.55, dy = k * b.h * 0.5, r = rect(b, dx, dy);
          if (!onScreen(r)) continue;
          const ov = overlap(r);
          if (ov < bestOv) { bestOv = ov; best = { dx, dy }; }
          if (ov === 0) break search;
        }
      }
      if (best && (best.dx !== u.slot.dx || best.dy !== u.slot.dy)) { u.slot = best; u.movedAt = now; }
    }
    placed.push(rect(b, u.slot.dx, u.slot.dy));
    const k = 1 - Math.exp(-dt / 0.25);                              // glide (~0.25 s), same at any frame rate
    u.dx = (u.dx || 0) + (u.slot.dx - (u.dx || 0)) * k;
    u.dy = (u.dy || 0) + (u.slot.dy - (u.dy || 0)) * k;
    b.sp.center.set(0.5 - u.dx / b.w, -u.dy / b.h);
    b.sp.renderOrder = 10 + (list.length - i);          // nearest on top
  });
}

function shadowAll(obj) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

const errEl = document.getElementById('err');
// German / English (i18n.js): the page's own texts follow the choice; speech lines switch with the next line spoken
const langBtn = document.getElementById('langBtn');
onLang(() => {
  const hint = document.getElementById('hint'), pen = document.querySelector('#veil .pen');
  hint.firstChild.nodeValue = t('hint') + ' ';
  pen.nextSibling.nodeValue = ' ' + t('veil');
  document.getElementById('camBtn').textContent = t('cameraBtn');
  document.querySelector('#cam select').setAttribute('aria-label', t('cameraSelect'));
  document.querySelector('#cam .refresh').title = t('cameraRefresh');
  document.querySelector('#cam img').alt = t('cameraImage');
  langBtn.replaceChildren(...['de', 'en'].flatMap((l, i) => [...(i ? [' | '] : []), Object.assign(document.createElement(l === lang() ? 'b' : 'span'), { textContent: l.toUpperCase() })]));
  langBtn.title = t('langTitle');
});
langBtn.addEventListener('click', e => { e.stopPropagation(); setLang(lang() === 'de' ? 'en' : 'de'); });

// what capture and generate are doing, and a glowing light where a new drawing will appear
const status = createStatus({ THREE, scene, el: document.getElementById('status'), world: () => current,
  banner: document.getElementById('arrive') });

const api = { THREE, scene, world, camera, controls, bubble, shadowAll, mood: lighting,
  reserved: () => status.reserved(), claimSpot: () => status.claimSpot(),
  arrived: (box, name, foot) => { status.arrived(box, name, foot); sound?.fx('plopp', box); },
  report: msg => { errEl.textContent += (errEl.textContent ? '\n' : '') + msg; } };
const err = document.getElementById('err');
let current = null;
window.__paperWorld = () => current;      // debug handles (inspection from devtools / tests)
window.__lighting = () => lighting;
window.__status = status;
window.__render = () => style.render();   // one frame on demand (tests that step the world themselves)

function clearWorld() {
  world.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); });
  });
  world.clear();
}

// characters' state (positions, moods, friendships) survives reloads — even a full page reload
const loadSaved = () => { try { return JSON.parse(sessionStorage.getItem('paperWorldState')); } catch { return null; } };
setInterval(() => { try { const st = current?.snapshot?.(); if (st) sessionStorage.setItem('paperWorldState', JSON.stringify(st)); } catch {} }, 2000);

async function load() {
  try {
    const mod = await import('./world.js?v=' + Date.now());
    const prev = current?.snapshot?.() || loadSaved();
    current = null;
    clearWorld();
    scene.scale.setScalar(1);          // things (e.g. a snow globe) may rescale the scene; reset on reload
    scene.position.set(0, 0, 0);
    err.textContent = '';
    const next = await mod.build(api, prev);
    current = next;
  } catch (e) {
    err.textContent = 'world.js: ' + e.message;
  }
}

const CORE = ['world.js', 'sim.js', 'sim-extra.js', 'island.js', 'characters.js', 'water.js', 'dialogues.js'];
let coreStamp = '', thingStamps = null, pageStamp = null;
const stampOf = async f => {
  const r = await fetch(f, { method: 'HEAD', cache: 'no-store' });
  return r.ok ? (r.headers.get('last-modified') || '') + r.headers.get('content-length') : null;
};
async function poll() {
  try {
    // the page itself changed (engine or style): reload fully (state is kept via sessionStorage)
    const ps = (await stampOf(location.pathname)) + (await stampOf('sound.js')) + (await stampOf('camera.js')) + (await stampOf('mood.js')) + (await stampOf('status.js')) + (await stampOf('i18n.js')) + (await stampOf('weather.js')) + (await stampOf('style.js'));
    if (pageStamp === null) pageStamp = ps;
    else if (ps !== pageStamp) { try { sessionStorage.setItem('paperWorldState', JSON.stringify(current?.snapshot?.())); } catch {} location.reload(); return; }

    try { status.update(await (await fetch('/api/status', { cache: 'no-store' })).json()); } catch {}

    const listing = await (await fetch('things/', { cache: 'no-store' })).text();
    const files = [...listing.matchAll(/href="([\w.-]+\.js)"/g)].map(m => m[1]);
    const stamps = new Map();
    for (const f of files) stamps.set(f, await stampOf('things/' + f));
    let core = '';
    for (const f of CORE) core += (await stampOf(f)) + ';';

    if (core !== coreStamp || !current) {
      // engine pieces changed: rebuild everything, but carry the characters' state over
      coreStamp = core; thingStamps = stamps;
      if (!files.length && !morph) newWorldTransition(false);
      else if (files.length && morph) releaseMorph();
      await load();
    } else {
      // only drawn things changed: reload just those, everyone else keeps going
      const changed = files.filter(f => thingStamps.get(f) !== stamps.get(f));
      const removed = [...thingStamps.keys()].filter(f => !stamps.has(f));
      if (removed.length && !files.length) newWorldTransition();   // all things gone at once: a new sheet, a new world
      if (morph && files.length) releaseMorph();                    // the first thing of the new world is here
      thingStamps = stamps;
      if ((changed.length || removed.length) && current.reloadThings) {
        err.textContent = '';             // stale errors from the previous version of a thing go away; new ones get reported again
        try { await current.reloadThings(changed, removed); } catch (e) { err.textContent = 'things: ' + e.message; }
      }
    }
  } catch {}
  setTimeout(poll, 500);
}
poll();

// sound on/off: audio needs a click first; a remembered "on" starts at the first click on the page
// (sound.js is loaded with cache-busting; api.sound / ctx.sound.fx become available once it's ready)
var sound = null;
import('./sound.js?v=' + Date.now()).then(m => {
  sound = m.createSound(THREE, camera);
  api.sound = sound;
  const btn = document.getElementById('snd');
  // the label says what a click will do
  const show = () => { btn.textContent = sound.enabled ? t('soundOff') : t('soundOn'); btn.setAttribute('aria-pressed', String(sound.enabled)); };
  onLang(show);
  btn.addEventListener('click', async e => {
    e.stopPropagation();
    await sound.setEnabled(!sound.enabled);
    try { localStorage.setItem('paperWorldSound', sound.enabled ? '1' : '0'); } catch {}
    show();
  });
  let want = false;
  try { want = localStorage.getItem('paperWorldSound') === '1'; } catch {}
  if (want) addEventListener('pointerdown', async () => { if (!sound.enabled) { await sound.setEnabled(true); show(); } }, { once: true });
  show();
}).catch(e => { document.getElementById('err').textContent = 'sound.js: ' + e.message; });

// version in the hint line: which build of Kritzel this page runs
fetch('/api/version', { cache: 'no-store' }).then(r => r.json())
  .then(v => { document.getElementById('ver').textContent = `· Kritzel v${v.version}${v.commit ? ' (' + v.commit + ')' : ''}`; }).catch(() => {});

// camera picker (local or network cameras) with a small live preview
import('./camera.js?v=' + Date.now())
  .then(m => m.cameraPicker({ button: document.getElementById('camBtn'), panel: document.getElementById('cam') }))
  .catch(e => { document.getElementById('err').textContent = 'camera.js: ' + e.message; });

// click a character to follow it with the camera; Esc or a click on empty ground stops
const card = document.getElementById('card');
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const canvas = renderer.domElement;
let focus = null, downAt = null, cardAt = 0;
const actorsNow = () => { try { return current?.brain?.()?.actors() || []; } catch { return []; } };
const isUnder = (o, root) => { for (; o; o = o.parent) if (o === root) return true; return false; };
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;   // a drag, not a click
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(world.children, true)[0]?.object;
  focus = (hit && actorsNow().find(a => isUnder(hit, a.rig.g))) || null;
  cardAt = 0;
  if (!focus) card.style.display = 'none';
});
addEventListener('keydown', e => { if (e.key === 'Escape') { focus = null; card.style.display = 'none'; } });

function mood(a) {
  const m = t('mood');
  if (a.fear > 0.4) return m.scared;
  if (a.energy < 0.3) return m.tired;
  if (a.hunger > 0.6) return m.hungry;
  return m.happy;
}
// who this character likes or avoids, by name (♥ friends, afraid of …)
function relations(a, byId) {
  const nameOf = id => byId[id]?.name ?? id;
  const list = Object.entries(a.rel || {}).filter(([id]) => byId[id]).sort((p, q) => q[1] - p[1]);
  const out = [];
  for (const [id, v] of list.slice(0, 2)) if (v > 0.3) out.push(t('likes', nameOf(id)));
  for (const [id, v] of list.slice(-2).reverse()) if (v < -0.2) out.push(a.fears?.includes(id) ? t('afraid', nameOf(id)) : t('dislikes', nameOf(id)));
  return out;
}
function refreshCard() {
  const alive = focus && actorsNow().includes(focus);
  if (focus && !alive) focus = null;
  if (!focus) { card.style.display = 'none'; return; }
  const a = focus, byId = current.brain().byId();
  const lines = [`${mood(a)}, ${t('activity')[a.goal?.type] || t('standing')}`, ...relations(a, byId)];
  card.replaceChildren(...lines.map((t, i) => { const el = document.createElement(i ? 'div' : 'b'); if (i) el.className = 'rel'; el.textContent = i ? t : (a.name ?? a.id) + ': ' + t; return el; }));
  card.style.display = 'block';
}
function followFocus() {
  const p = new THREE.Vector3(focus.pos.x, 0.6, focus.pos.z);
  const d = p.sub(controls.target).multiplyScalar(0.08);   // ease toward the character, keeping the user's view angle
  controls.target.add(d); camera.position.add(d);
}

// ---------- new-world transition: old island shrinks away, veil, new island grows in ----------
const veil = document.getElementById('veil');
// the veil stays up until the first drawn thing of the new world has arrived
let morph = null;                      // { t0, release }
function newWorldTransition(shrink = true) {
  morph = { t0: performance.now() - (shrink ? 0 : 800), release: null };
  veil.classList.add('on');
  if (shrink) sound?.fx('melodie');
}
function releaseMorph() { if (morph && !morph.release) morph.release = Math.max(performance.now(), morph.t0 + 1200); }
function stepMorph() {
  if (!morph) return;
  const now = performance.now(), t = (now - morph.t0) / 1000;
  let s = 0;
  if (t < 0.8) s = 1 - (t / 0.8) ** 2;                       // shrink away
  if (morph.release && now >= morph.release) {
    const k = Math.min(1, (now - morph.release) / 1200);      // grow back with a little bounce
    s = 1 + Math.sin(k * Math.PI) * 0.12 * (1 - k) - (1 - k) ** 3;
    veil.classList.remove('on');
    if (k >= 1) { s = 1; morph = null; }
  }
  world.scale.setScalar(Math.max(0.0001, s));
  world.rotation.y = (1 - Math.min(1, s)) * 1.2;
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  try { current?.update?.(clock.elapsedTime, dt); } catch (e) { err.textContent = 'update: ' + e.message; }
  for (const a of actorsNow()) a.followed = a === focus;   // the followed character waves at the viewer (sim)
  if (focus) {
    if (actorsNow().includes(focus)) followFocus(); else focus = null;
    if (performance.now() > cardAt) { cardAt = performance.now() + 250; try { refreshCard(); } catch {} }
  }
  stepMorph();
  layoutBubbles(dt);
  lighting.update(clock.elapsedTime, dt);
  status.tick(camera);
  controls.update();
  style.render();                      // the scene, drawn on paper when ?style=paper (style.js)
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  style.setSize();
});
</script>
</body>
</html>
